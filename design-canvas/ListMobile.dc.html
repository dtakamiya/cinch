<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: oklch(0.16 0.012 265);
      --panel: oklch(0.194 0.014 265);
      --panel-2: oklch(0.224 0.016 265);
      --border: oklch(0.30 0.014 265);
      --border-soft: oklch(0.26 0.012 265);
      --fg: oklch(0.96 0.005 265);
      --muted: oklch(0.68 0.012 265);
      --faint: oklch(0.52 0.012 265);
      --accent: oklch(0.64 0.19 275);
      --accent-soft: oklch(0.64 0.19 275 / 0.14);
      --good: oklch(0.72 0.15 155);
      --warn: oklch(0.72 0.15 75);
      --bad: oklch(0.68 0.15 25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: oklch(0.72 0.16 275); }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="min-height: 844px; width: 390px; background: var(--bg); padding: 24px 16px 40px;">

  <header style="display: flex; align-items: center; gap: 10px;">
    <div style="width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft);
      border: 1px solid oklch(0.64 0.19 275 / 0.35); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.64 0.19 275)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
    </div>
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em;">cinch</div>
  </header>

  <div style="display: flex; gap: 10px; margin-top: 18px;">
    <div style="flex: 1; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 11px; padding: 12px 14px;">
      <div style="font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em;">平均</div>
      <div class="num" style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px;">72.4</div>
    </div>
    <div style="flex: 1; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 11px; padding: 12px 14px;">
      <div style="font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em;">採点済み</div>
      <div class="num" style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px;">18 / 24</div>
    </div>
  </div>

  <div style="display: flex; gap: 8px; margin-top: 14px; overflow-x: auto;">
    <span style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); border: 1px solid oklch(0.64 0.19 275 / 0.35); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 500;">スコア順</span>
    <span style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; color: var(--muted);">すべて</span>
    <span style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; color: var(--muted);">7 日</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <sc-if value="{{r.gradable}}" hint-placeholder-val="{{ true }}">
        <div style="background: var(--panel); border: 1px solid var(--border-soft); border-radius: 12px; padding: 14px 16px;">
          <div style="display: flex; align-items: center; gap: 14px;">
            <div style="position: relative; width: 52px; height: 52px; flex-shrink: 0;">
              <svg width="52" height="52" viewBox="0 0 52 52">
                <circle cx="26" cy="26" r="22" fill="none" stroke="var(--border)" stroke-width="4"></circle>
                <circle cx="26" cy="26" r="22" fill="none" stroke="{{r.ringColor}}" stroke-width="4" stroke-linecap="round" stroke-dasharray="{{r.dash}}" transform="rotate(-90 26 26)"></circle>
              </svg>
              <div class="num" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; letter-spacing: -0.02em;">{{r.total}}</div>
            </div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em;">{{r.project}}</div>
              <div class="num" style="font-size: 12px; color: var(--muted); margin-top: 3px;">{{r.startedAt}} ・ {{r.duration}} ・ {{r.turns}} ターン</div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-soft);">
            <span style="font-size: 10.5px; color: var(--faint);">主な減点</span>
            <span style="display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 500;">
              <span style="width: 5px; height: 5px; border-radius: 999px; background: {{r.tagDot}};"></span>
              {{r.topDeduction}}
            </span>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{r.ungraded}}" hint-placeholder-val="{{ false }}">
        <div style="border: 1px dashed var(--border-soft); border-radius: 12px; padding: 12px 16px;">
          <div style="font-size: 14px; font-weight: 500; color: var(--muted);">{{r.project}}</div>
          <div class="num" style="font-size: 12px; color: var(--faint); margin-top: 3px;">{{r.startedAt}} ・ {{r.turns}} ターン ・ 採点対象外</div>
        </div>
      </sc-if>
    </sc-for>
  </div>
</div>

</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ring = (total) => {
      const c = 2 * Math.PI * 22;
      const on = (total / 100) * c;
      return `${on.toFixed(1)} ${(c - on).toFixed(1)}`;
    };
    const color = (t) => (t >= 80 ? "var(--good)" : t >= 60 ? "var(--warn)" : "var(--bad)");
    const g = (o) => ({
      gradable: true, ungraded: false,
      total: o.total, project: o.project, startedAt: o.startedAt,
      duration: o.duration, turns: o.turns, topDeduction: o.topDeduction,
      dash: ring(o.total), ringColor: color(o.total), tagDot: color(o.total),
    });
    const u = (o) => ({ gradable: false, ungraded: true, project: o.project, startedAt: o.startedAt, turns: o.turns });
    return {
      rows: [
        g({ total: 91, project: "cinch", startedAt: "8/26 14:12", duration: "1時間4分", turns: 38, topDeduction: "キャッシュ TTL の無駄" }),
        g({ total: 78, project: "web-console", startedAt: "8/26 11:03", duration: "42分", turns: 21, topDeduction: "ツールエラー率" }),
        g({ total: 74, project: "billing-api", startedAt: "8/25 19:47", duration: "2時間", turns: 55, topDeduction: "冗長なファイル読み込み" }),
        g({ total: 52, project: "mobile-app", startedAt: "8/24 16:40", duration: "1時間18分", turns: 44, topDeduction: "コンテキストの肥大" }),
        u({ project: "docs-site", startedAt: "8/24 10:05", turns: 2 }),
      ],
    };
  }
}
</script>
</body>
</html>
